# Flow: Varredura — BillingNoticeBanner ausente em TODAS as telas com billing (conta ativa)
#
# Uso:
#   maestro test flows/billing-banner-ausente-ativo.yaml
#
# Pre-condicao: conta Ativa (status=active, sem limites atingidos)
#
# O que verifica:
#   Para conta ativa, shouldShowBillingNoticeBanner() retorna false.
#   Portanto NENHUMA das 4 telas com integracao de billing deve exibir
#   qualquer texto de banner.
#
# Telas verificadas:
#   1. Dashboard (inicio) — BillingNoticeBanner apos saudacao
#   2. Voluntarios (admin) — banner quando isBlocked || isVolunteerLimitReached
#   3. Ministerios (admin) — banner quando isBlocked || isMinistryLimitReached
#   4. Configuracoes — BillingStatusPanel (nao e banner, mas verifica ausencia de alertas)

appId: com.church.artos
---
- launchApp
- runFlow: _login.yaml

- openLink: diakonia:///inicio
- extendedWaitUntil:
    visible: 'Início'
    timeout: 120000

# --- Tela 1: Dashboard ---
- openLink: diakonia:///inicio
- waitForAnimationToEnd:
    timeout: 15000
- assertVisible: 'Início'
# Status: ativa (varredura sem banners)
# BillingStatusPanel fica no fim do scroll do DashboardAdmin (abaixo da dobra)
- scrollUntilVisible:
    element: 'Assinatura em dia'
    direction: DOWN
    timeout: 20000
- assertVisible: 'Assinatura em dia'
- assertNotVisible: 'Avaliação encerrada'
- assertNotVisible: 'Sua cobrança está pendente'
- assertNotVisible: 'Pagamento em atraso'
- assertNotVisible: 'Capacidade excedida'
- assertNotVisible: 'Assinatura cancelada'
- assertNotVisible: 'Versão avaliativa'
- assertNotVisible: 'Seu período avaliativo terminou'
- takeScreenshot: billing-banner-ausente-inicio

# --- Tela 2: Voluntarios ---
- openLink: diakonia:///admin/voluntarios
- waitForAnimationToEnd:
    timeout: 15000
- assertNotVisible: 'Avaliação encerrada'
- assertNotVisible: 'Sua cobrança está pendente'
- assertNotVisible: 'Capacidade excedida'
- assertNotVisible: 'Assinatura cancelada'
- assertNotVisible: 'Versão avaliativa'
- takeScreenshot: billing-banner-ausente-voluntarios

# --- Tela 3: Ministerios ---
- openLink: diakonia:///admin/ministerios
- waitForAnimationToEnd:
    timeout: 15000
- assertNotVisible: 'Avaliação encerrada'
- assertNotVisible: 'Sua cobrança está pendente'
- assertNotVisible: 'Capacidade excedida'
- assertNotVisible: 'Assinatura cancelada'
- assertNotVisible: 'Versão avaliativa'
- takeScreenshot: billing-banner-ausente-ministerios

# --- Tela 4: Configuracoes ---
- openLink: diakonia:///configuracoes
- waitForAnimationToEnd:
    timeout: 15000
- assertNotVisible: 'Avaliação encerrada'
- assertNotVisible: 'Sua cobrança está pendente'
- assertNotVisible: 'Capacidade excedida'
- assertNotVisible: 'Assinatura cancelada'
- assertNotVisible: 'Versão avaliativa'
- takeScreenshot: billing-banner-ausente-configuracoes
