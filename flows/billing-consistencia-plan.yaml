# Flow: Consistencia de dados de billing entre multiplas telas
#
# Uso:
#   maestro test flows/billing-consistencia-plan.yaml
#
# Pre-condicao: conta Ativa, Crescimento, 31 voluntarios
#
# O que verifica:
#   - Badge "Crescimento" em Configuracoes header card
#   - Stat "31/180" no hero card de voluntarios (header, no combinado)
#   - MetaLine na aba Assinatura mostra texto exato da conta de staging
#   - Contagem "31" no no separado da barra de uso (aba Assinatura)
#   - Dados nao mudam ao navegar entre abas e telas
#
# Nota sobre texto: Maestro faz full-text match. "31/180" no header e um
# no separado de "31" na barra de uso da aba Assinatura.

appId: com.church.artos
---
- launchApp
- runFlow: _login.yaml

- openLink: diakonia:///inicio
- extendedWaitUntil:
    visible: 'Início'
    timeout: 120000

# --- Passo 1: badge + stat no header card de Configuracoes ---
- openLink: diakonia:///configuracoes
- waitForAnimationToEnd:
    timeout: 15000
- assertVisible: 'Crescimento'
# Header stat card mostra "31/180" como no unico (confirma UIAutomator dump)
# Contagem varia por conta -> regex (ex.: 76/180)
- assertVisible: '\d+/180'
- takeScreenshot: billing-consistencia-configuracoes-header

# --- Passo 2: mesma info na aba Assinatura ---
- tapOn:
    text: '.+, Assinatura'
- waitForAnimationToEnd:
    timeout: 15000
- assertVisible: 'Crescimento'
- assertVisible: 'Assinatura em dia'
# Status pill
- assertVisible: 'Ativa'
# MetaLine: partes estaveis (sem data para evitar stale apos renovacao)
# MetaLine renderiza como um no so ("Crescimento · Mensal · Renova em DD/MM/AAAA") -> regex
- assertVisible: '.*Mensal.*'
- assertVisible: '.*Renova em.*'
# Barra de uso: "31" e " / 180" sao nos distintos
- assertVisible: '\d+'
- takeScreenshot: billing-consistencia-aba-assinatura

# --- Passo 3: trocar para aba Dados e voltar ---
- tapOn: 'Dados'
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    text: '.+, Assinatura'
- waitForAnimationToEnd:
    timeout: 15000

# Dados nao ficaram stale apos re-navegacao
- assertVisible: 'Crescimento'
- assertVisible: 'Assinatura em dia'

# --- Passo 4: tela de Voluntarios deve mostrar contagem consistente ---
- openLink: diakonia:///admin/voluntarios
- waitForAnimationToEnd:
    timeout: 15000
- assertVisible: 'Voluntários'
# Header de voluntarios mostra o total
- takeScreenshot: billing-consistencia-voluntarios

# --- Passo 5: voltar a Configuracoes e confirmar dados inalterados ---
- openLink: diakonia:///configuracoes
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    text: '.+, Assinatura'
- waitForAnimationToEnd:
    timeout: 15000
- assertVisible: 'Crescimento'
- assertVisible: '\d+'
- assertVisible: 'Gerenciar assinatura'
- takeScreenshot: billing-consistencia-final
