# Flow: Auditoria profunda de dados na aba Assinatura
#
# Uso:
#   maestro test flows/billing-dados-assinatura.yaml
#
# Pre-condicao: conta Ativa, plano Crescimento (staging padrao)
#
# O que verifica:
#   - Titulo de status "Assinatura em dia" (active)
#   - Pill "Ativa" visivel
#   - Badge "Crescimento" no header card
#   - "Renova em" + data na metaLine
#   - Contagem "31" de voluntarios na barra de uso
#   - "Gerenciar assinatura" como UNICO CTA
#   - Ausencia de TODOS os botoes removidos (3.1.1)

appId: com.church.artos
---
- launchApp
- runFlow: _login.yaml

- openLink: diakonia:///inicio
- extendedWaitUntil:
    visible: 'Início'
    timeout: 120000

- openLink: diakonia:///configuracoes
- waitForAnimationToEnd:
    timeout: 15000

# Badge de plano no header card de Configuracoes
- assertVisible: 'Crescimento'

# Aba Assinatura (index 1 = aba; index 0 = card de status no topo)
- tapOn:
    text: 'Assinatura'
    index: 1
- waitForAnimationToEnd:
    timeout: 15000

# Status title para conta ativa
- assertVisible: 'Assinatura em dia'

# Pill de status
- assertVisible: 'Ativa'

# Eyebrow/header do painel de status
- assertVisible: 'Assinatura'

# Crescimento aparece no badge do header (no separado)
- assertVisible: 'Crescimento'

# MetaLine: cada parte aparece como no independente na hierarquia
- assertVisible: 'Mensal'
- assertVisible: 'Renova em'

# Barra de uso: "31" e " / 180" sao nos separados (conforme dump UIAutomator)
- assertVisible: 'Voluntários'
- assertVisible: '31'

# Unico CTA de billing (Apple 3.1.1)
- assertVisible: 'Gerenciar assinatura'

# Botoes removidos NAO devem aparecer
- assertNotVisible: 'Cancelar assinatura'
- assertNotVisible: 'Ver planos'
- assertNotVisible: 'Trocar plano'
- assertNotVisible: 'Assinar agora'
- assertNotVisible: 'Escolher plano'
- assertNotVisible: 'Atualizar plano'
- assertNotVisible: 'Cancelar troca de plano'

- takeScreenshot: billing-dados-assinatura
