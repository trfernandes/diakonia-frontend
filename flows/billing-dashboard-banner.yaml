# Flow: BillingNoticeBanner no dashboard
#
# Uso:
#   maestro test flows/billing-dashboard-banner.yaml
#
# O que verifica:
#   - App navega ao dashboard sem crash
#   - Nenhum modal de billing abre automaticamente
#   - Header "Inicio" visivel

appId: com.church.artos
---
- launchApp
- runFlow: _login.yaml

# Forcar navegacao ao Inicio (app pode estar em outra tela da sessao anterior)
- openLink: diakonia:///inicio
- waitForAnimationToEnd:
    timeout: 15000

# Aguardar header carregar (independente do conteudo do dashboard estar pronto)
- assertVisible: 'Início'

# Status ativo (dashboard com account ativa)
# BillingStatusPanel fica no fim do scroll do DashboardAdmin (abaixo da dobra)
- scrollUntilVisible:
    element: 'Assinatura em dia'
    direction: DOWN
    timeout: 20000
- assertVisible: 'Assinatura em dia'
- assertVisible: 'Ativa'

# [COMPLIANCE 3.1.1] Nenhum modal de billing deve abrir automaticamente
- assertNotVisible: 'Opções de Planos'
- assertNotVisible: 'Escolher plano'
- assertNotVisible: 'Ver planos'

# [COMPLIANCE 3.1.1] Dashboard nao pode ter CTA de compra dinamico (banner ou painel)
- assertNotVisible: 'Assinar agora'
- assertNotVisible: 'Retomar pagamento'
- assertNotVisible: 'Atualizar plano'
- assertNotVisible: 'Reativar assinatura'

# Se "Carregando..." nao estiver mais na tela, verifica que conteudo esta ok
- runFlow:
    when:
      notVisible: 'Carregando...'
    commands:
      - assertVisible: 'Início'

- takeScreenshot: billing-dashboard-estado
