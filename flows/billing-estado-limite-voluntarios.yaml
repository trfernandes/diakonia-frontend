# Flow: Capacidade de voluntarios excedida — banner em Voluntarios, Ministerios livre
#
# Uso:
#   1. Rodar SQL de setup no Neon (ver abaixo)
#   2. maestro test flows/billing-estado-limite-voluntarios.yaml
#   3. Rodar SQL de revert IMEDIATAMENTE apos o teste
#
# ════════════════════════════════════════════════
# SQL SETUP (rodar antes):
#
#   -- Muda plano para starter (maxVolunteers=30).
#   -- A conta tem 31 voluntarios ativos → currentVolunteers=31 > maxVolunteers=30
#   -- → hasExceededPlanCapacity=true → BillingNoticeBanner aparece.
#   -- Obs: status permanece 'active' (isBlocked=false).
#   UPDATE subscriptions
#   SET plan = 'starter'
#   WHERE "churchId" = (SELECT id FROM igrejas WHERE codigo = 'teste-church');
#   UPDATE igrejas
#   SET "maxVoluntarios" = 30
#   WHERE codigo = 'teste-church';
#
# SQL REVERT (rodar apos):
#
#   UPDATE subscriptions
#   SET plan = 'crescimento'
#   WHERE "churchId" = (SELECT id FROM igrejas WHERE codigo = 'teste-church');
#   UPDATE igrejas
#   SET "maxVoluntarios" = 180
#   WHERE codigo = 'teste-church';
# ════════════════════════════════════════════════
#
# O que verifica:
#   currentVolunteers=31, maxVolunteers=30 (starter plan)
#   isPlanLimitReached('volunteers') = true  (31 >= 30)
#   hasExceededPlanCapacity = true  (31 > 30)
#   isSubscriptionWriteBlocked = false (status='active')
#   isBlocked = false
#
#   Voluntarios:
#     showBillingBanner && (isBlocked || isVolunteerLimitReached) = true
#     shouldShowBillingNoticeBanner = true (hasExceededPlanCapacity=true)
#     BillingNoticeBanner: eyebrow="Capacidade excedida"
#       title="Seu uso atual ja ultrapassa o plano contratado"
#
#   Ministerios:
#     isMinistryLimitReached: 3 ministerios / maxMinistries=3 (starter) — limite atingido
#     blockFab = isBlocked || isMinistryLimitReached = true -> banner em ministerios tambem
#     (com 3 ministerios e limite=3 do starter)
#
#   BillingStatusPanel (Configuracoes aba Assinatura):
#     Status continua "Assinatura em dia" (status='active')
#     Barra de voluntarios mostra helper="Excedido em 1" (31-30=1)

appId: com.church.artos
---
- launchApp
- runFlow: _login.yaml
- openLink: diakonia:///inicio
- extendedWaitUntil:
    visible: 'Início'
    timeout: 120000

# ── Passo 1: Banner "Capacidade excedida" em Voluntarios ───────────────────
- openLink: diakonia:///admin/voluntarios
- extendedWaitUntil:
    visible: 'Capacidade excedida'
    timeout: 15000
# Banner de alerta por limite atingido
- assertVisible: 'Capacidade excedida'
- assertVisible: 'Seu uso atual já ultrapassa o plano contratado'
# Ainda ativo (não bloqueado)
- assertVisible: 'Ativa'
- assertNotVisible: 'Avaliação encerrada'
- assertNotVisible: 'Pagamento em atraso'
- takeScreenshot: billing-limite-voluntarios-banner

# ── Passo 2: Configuracoes — status ativo mas barra em vermelho ─────────────
- openLink: diakonia:///configuracoes
- waitForAnimationToEnd:
    timeout: 15000
- runFlow:
    when:
      visible: 'Servidor indisponível'
    file: _retry_servidor.yaml
- extendedWaitUntil:
    visible: 'Assinatura'
    timeout: 15000
- tapOn:
    text: '.+, Assinatura'
- waitForAnimationToEnd:
    timeout: 15000
# Status permanece ativo mesmo com capacidade excedida
- assertVisible: 'Assinatura em dia'
- assertVisible: 'Ativa'
# Helper na barra de voluntarios (currentVolunteers=31 - maxVolunteers=30 = 1)
- assertVisible: 'Excedido em 1'
- assertVisible: 'Gerenciar assinatura'
- takeScreenshot: billing-limite-voluntarios-configuracoes
