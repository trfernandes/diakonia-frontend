# Flow: Status de billing nao desatualiza ao trocar de aba (adversarial)
#
# Uso:
#   maestro test flows/billing-status-navegacao.yaml
#
# O que verifica (adversarial):
#   - Status carrega na primeira visita
#   - Navegar para outra aba e voltar nao deixa tela em branco
#   - "Gerenciar assinatura" continua presente apos re-navegacao
#   - Sem crash ao trocar de aba

appId: com.church.artos
---
- launchApp
- runFlow: _login.yaml

- assertVisible: 'Início'

- openLink: diakonia:///configuracoes
- waitForAnimationToEnd:
    timeout: 15000

# Visita 1: aba Assinatura (index 1 pois index 0 eh o card de status no topo)
- tapOn:
    text: 'Assinatura'
    index: 1
- waitForAnimationToEnd:
    timeout: 15000
- assertVisible: 'Gerenciar assinatura'
- takeScreenshot: billing-nav-visita-1

# Navegar para outra aba
- tapOn: 'Dados'
- waitForAnimationToEnd:
    timeout: 2000

# Voltar para Assinatura (visita 2)
- tapOn:
    text: 'Assinatura'
    index: 1
- waitForAnimationToEnd:
    timeout: 15000

# [ADVERSARIAL] Status deve continuar correto - sem stale
- assertVisible: 'Gerenciar assinatura'
- assertVisible: 'Assinatura em dia'
# Status pill persiste mesmo apos re-navegacao
- assertVisible: 'Ativa'

- takeScreenshot: billing-nav-visita-2
