# Flow: Verificar tela de Assinatura (billing status)
#
# Uso:
#   maestro test flows/billing-status.yaml
#
# Pre-condicao: usuario deve ser ADMIN de uma igreja com assinatura ativa.
# O que verifica:
#   - Navegacao ate a aba "Assinatura" em Configuracoes
#   - Card de status "Assinatura em dia" visivel
#   - Botao "Gerenciar assinatura" visivel (unico CTA - Apple 3.1.1)

appId: com.church.artos
---
- launchApp
- runFlow: _login.yaml

# Garantir que o home carregou antes do deep link (evita race condition de inicializacao)
# Timeout maior que o default (17s): emulador do CI é mais lento pra bundlar/navegar pós-login
- extendedWaitUntil:
    visible: 'Início'
    timeout: 60000

- openLink: diakonia:///configuracoes
- waitForAnimationToEnd:
    timeout: 15000

# Aba "Assinatura" (index 1 pois index 0 eh o card de status no topo)
- tapOn:
    text: 'Assinatura'
    index: 1
- waitForAnimationToEnd:
    timeout: 15000

# Verificar card de status carregou (conta de staging esta ativa)
- assertVisible: 'Assinatura em dia'
# Status pill
- assertVisible: 'Ativa'

# Unico botao de billing - Apple 3.1.1
- assertVisible: 'Gerenciar assinatura'

- takeScreenshot: billing-status
