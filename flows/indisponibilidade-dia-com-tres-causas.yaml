# Flow: Modal "Por que está indisponível" lista as 3 causas do mesmo dia (caso E2E 1.3)
#
# Pré-condição (staging, igreja E2E E2ETEST), criada pelo PRÓPRIO e2e.voluntario@diakonia.app
# (regras do líder ficam invisíveis pro voluntário, ADR-0012):
#   - regra geral PERIODO 26/11/2026 a 26/11/2026, sem escopo (motivo 'E2E 1.3 geral')
#   - regra PERIODO 26/11/2026 com ministeriosInteirosIds = [Louvor] (motivo 'E2E 1.3 ministerio')
#   - avulsa 26/11/2026 (motivo 'E2E 1.3 avulsa')
# Criar via API como o voluntário (POST /regras-indisponibilidade-voluntarios e
# POST /indisponibilidades-voluntarios) antes de rodar.
# Rodar com -e APP_EMAIL=e2e.voluntario@diakonia.app -e APP_PASSWORD=...
#
# O que verifica: tocar num dia com as 3 causas abre o modal com as 3 seções
# ("Bloqueio pontual", "Regra do ministério — Louvor", "Regra geral").
# Limpeza: apagar as 2 regras e a avulsa com motivo 'E2E 1.3 %' depois.

appId: com.church.artos
---
- launchApp
- runFlow: _login.yaml
- openLink: diakonia:///inicio
- extendedWaitUntil:
    visible: 'Início'
    timeout: 120000
- openLink: diakonia:///pessoal/indisponibilidade
- extendedWaitUntil:
    visible: 'Minhas Indisponibilidades'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 15000
- scrollUntilVisible:
    element:
      text: 'Novembro.*'
    direction: DOWN
    timeout: 20000
    centerElement: true
- takeScreenshot: vol-3causas-calendario
- tapOn:
    text: '26'
    below:
      text: 'Novembro.*'
- extendedWaitUntil:
    visible: 'Por que está indisponível'
    timeout: 15000
- takeScreenshot: vol-3causas-modal
- assertVisible: '.*Bloqueio pontual.*'
- assertVisible: '.*E2E 1.3 avulsa.*'
- assertVisible: '.*Regra do ministério.*Louvor.*'
- assertVisible: '.*Regra geral.*'
- assertNotVisible: 'Nenhuma causa encontrada para este dia.'
