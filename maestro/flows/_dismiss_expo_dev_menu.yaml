# Subflow: descarta o modal de onboarding do Expo Developer Menu
# Aparece na primeira conexao ao Metro apos clearState ou nova instalacao.
# Nao chamar diretamente — acionado por _login.yaml quando "Runtime version" visivel.
appId: com.church.artos
---
- tapOn: 'Continue'
- waitForAnimationToEnd:
    timeout: 3000
# "Continue" abre o menu completo (Reload / Go home) — fechar com Back
- pressKey: back
- waitForAnimationToEnd:
    timeout: 2000
