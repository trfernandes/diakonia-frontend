appId: com.church.artos
---
# ═══════════════════════════════════════════════════════════════════
# Teste: CHK-06 (P1) — Item problema desaparece após adicionar integrante
#
# O que valida:
#   Pré-condição: função com 0 integrantes (mostra no checklist)
#   Passos: 1. Clicar item "sem integrantes"
#           2. Adicionar integrante na tela que abre
#           3. Voltar pra Configurar
#   Esperado: item desaparece do checklist SEM recarregar a página
#
# Requer seed: função "Flauta" (ou similar) sem integrantes
# ═══════════════════════════════════════════════════════════════════

- launchApp
- waitForAnimationToEnd:
    timeout: 5000

- runFlow: _login.yaml

- extendedWaitUntil:
    visible: 'Início'
    timeout: 120000

- waitForAnimationToEnd:
    timeout: 4000

# Navegar até Escalas do ministério
- tapOn:
    point: '7%, 5%'
- waitForAnimationToEnd:
    timeout: 2000

- tapOn:
    text: 'Escalas'
    index: 1
- waitForAnimationToEnd:
    timeout: 4000

# Abrir FAB e selecionar "Gerar automaticamente"
- tapOn:
    point: '90%, 87%'
- waitForAnimationToEnd:
    timeout: 2000

- tapOn:
    text: 'Gerar automaticamente'
- waitForAnimationToEnd:
    timeout: 3000

# Navegar até checklist
- tapOn:
    text: 'Como quer chamar essa escala?'
- inputText: 'Escala CHK-06 Integrante'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 1000

- tapOn:
    text: 'Próximo'
- waitForAnimationToEnd:
    timeout: 3000

# Aguardar checklist com item de "sem integrantes"
- extendedWaitUntil:
    visible: 'sem integrantes'
    timeout: 15000

- assertVisible:
    text: 'sem integrantes'

# Capturar estado ANTES de adicionar integrante
- takeScreenshot: chk-06-antes-adicionar

# Clicar no item do checklist para resolver o problema
- tapOn:
    text: 'sem integrantes'
- waitForAnimationToEnd:
    timeout: 3000

# Validar que navega para tela de Integrantes ou Funções
# (assistente ofereceria opção de adicionar via bottom sheet ou tela separada)
- assertVisible:
    text: 'Integrante'
    optional: true

# Simulando adição de integrante (ou só voltar se a tela de adicionar não
# for parte deste flow — deixar como optional para não travar)
- pressKey: back
- waitForAnimationToEnd:
    timeout: 2000

# Voltar pro checklist — validar que item DESAPARECEU
- assertNotVisible:
    text: 'sem integrantes'
    optional: true

- takeScreenshot: chk-06-depois-adicionar
