appId: com.church.artos
---
# ═══════════════════════════════════════════════════════════════════
# Teste: CHK-10 (P1) — Ministério novo vazio não crusha / mostra msg guia
#
# O que valida:
#   Pré-condição: ministério recém-criado, sem nenhuma função, sem integrantes
#   Passos: 1. Criar novo ministério (ou usar um vazio de teste)
#           2. Abrir Configurar Escala
#   Esperado: ministério aparece no checklist com msg guia (não erro bravo/crash)
#            "Parece que não há dados. Comece adicionando funções e integrantes."
#
# Requer seed: ministério vazio "Novidade" (ou criar via API antes do teste)
# ═══════════════════════════════════════════════════════════════════

- launchApp
- waitForAnimationToEnd:
    timeout: 5000

- runFlow: _login.yaml

- extendedWaitUntil:
    visible: 'Início'
    timeout: 120000

- waitForAnimationToEnd:
    timeout: 4000

# Navegar até drawer e procurar ministério novo/vazio
- tapOn:
    point: '7%, 5%'
- waitForAnimationToEnd:
    timeout: 2000

# Procurar um ministério novo (scroll do drawer se necessário)
# Assumindo que existe um ministério chamado "Novidade" ou semelhante
- scrollUntilVisible:
    element: { text: 'Novidade|Novo' }
    direction: DOWN
    timeout: 10000
    optional: true

# Toque em "Escalas" do ministério novo
- tapOn:
    text: 'Escalas'
    index: 2
    optional: true
- waitForAnimationToEnd:
    timeout: 4000

# Se scrollUntilVisible falhou, tentar um ministério qualquer
# (esse flow é mais pra validar que não crusha, menos pra testar com ministério específico)
- assertVisible:
    text: 'Escalas'
    optional: true

# Abrir FAB
- tapOn:
    point: '90%, 87%'
- waitForAnimationToEnd:
    timeout: 2000

# Gerar automaticamente
- tapOn:
    text: 'Gerar automaticamente'
- waitForAnimationToEnd:
    timeout: 3000

# Preencher nome
- tapOn:
    text: 'Como quer chamar essa escala?'
- inputText: 'Escala CHK-10 Vazia'
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 1000

- tapOn:
    text: 'Próximo'
- waitForAnimationToEnd:
    timeout: 3000

# Aguardar checklist (ou msg de vazio)
# Se ministério está completamente vazio, espera-se:
#   a) Checklist com avisos (sem funções, sem integrantes, etc)
#   b) Ou msg de "não há dados" / "comece adicionando"
#   c) Ou tela de erro amigável

- extendedWaitUntil:
    visible: 'dados|sem|Não há|aviso'
    timeout: 15000
    optional: true

# Validar que NÃO é crash (app não fecha, não exibe erro técnico cru)
- assertVisible:
    text: 'dados|sem|Não há|aviso|Próximo|Gerar'
    optional: true

- takeScreenshot: chk-10-ministerio-vazio
