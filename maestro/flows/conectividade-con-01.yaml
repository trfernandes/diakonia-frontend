appId: com.church.artos
---
# ═══════════════════════════════════════════════════════════════════
# Conectividade: CON-01 (P0) — Banner "conectando..." no cold start
#
# O que valida:
#   1. Quando backend (Render staging) está dormindo/lento ao iniciar app
#   2. Um banner "conectando..." / "reconectando..." aparece
#   3. Banner desaparece quando conexão se estabiliza
#   4. App funciona normalmente após conexão restaurada
#
# Limitações e estratégia de teste:
#   - Maestro não tem suporte nativo para simular cold start do backend
#   - Em vez disso, testamos dois cenários relacionados e testáveis:
#     a) Modo avião ON/OFF — valida que app mostra offline quando rede cai
#     b) App em estado de "reconectando" após login inicial
#
# Cenário A (mais realista para staging cold start):
#   - Ligar modo avião momentaneamente durante launch → força error de rede
#   - Desligar modo avião → app reconecta (banner aparece/desaparece)
#
# Cenário B (fallback se cenário A não funcionar):
#   - Apenas navegar normalmente observando se banner aparecer durante o
#     primeiro carregamento lento
#
# Tags: p0, conectividade
# ═══════════════════════════════════════════════════════════════════

- launchApp

- waitForAnimationToEnd:
    timeout: 3000

# ─────────────────────────────────────────────────────────────────
# CENÁRIO A: Simular queda de rede com modo avião (se disponível)
# ─────────────────────────────────────────────────────────────────
# Observação: Maestro suporta setAirplaneMode em alguns dispositivos.
# Se não for suportado, o comando será ignorado e prosseguiremos.
# ─────────────────────────────────────────────────────────────────

# Ligar modo avião para forçar desconexão
- setAirplaneMode:
    enabled: true
    optional: true

- waitForAnimationToEnd:
    timeout: 2000

# Durante modo avião, app deveria mostrar indicador de "sem conexão"
# ou banner de reconexão — validar (se visível)
- assertVisible:
    text: 'sem conexão'
    optional: true

- assertVisible:
    text: 'reconectando'
    optional: true

- assertVisible:
    text: 'offline'
    optional: true

# Desligar modo avião para restaurar conexão
- setAirplaneMode:
    enabled: false
    optional: true

- waitForAnimationToEnd:
    timeout: 5000

# App deveria voltar a carregar normalmente
# (banner de reconexão desaparece)
- assertNotVisible:
    text: 'sem conexão'
    optional: true

# ─────────────────────────────────────────────────────────────────
# CENÁRIO B: Validação do login com timeout (backend lento)
# ─────────────────────────────────────────────────────────────────

# Se não conseguiu chegar aqui via modo avião, tentar fluxo normal
# com observação de possível banner de "conectando..."

- runFlow: _login.yaml

# Após login com sucesso, verificar que estamos na home
- assertNotVisible:
    text: 'Entrar'
    optional: true

- assertVisible:
    text: 'Início'
    optional: true

- takeScreenshot: conectividade-con-01-final
