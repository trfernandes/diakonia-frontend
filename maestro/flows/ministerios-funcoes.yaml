# Flow: Ministério Funções — lista de funções de um ministério
#
# Uso:
#   maestro test maestro/flows/ministerios-funcoes.yaml \
#     -e APP_EMAIL=seu@email.com \
#     -e APP_PASSWORD=SuaSenha123

appId: com.church.artos
---
- launchApp
- waitForAnimationToEnd:
    timeout: 5000

- runFlow: _login.yaml

- extendedWaitUntil:
    visible: 'Início'
    timeout: 120000

- waitForAnimationToEnd:
    timeout: 4000

- tapOn:
    point: '6%,4%'
- waitForAnimationToEnd:
    timeout: 2000
# Louvor expande submenu no drawer. Casa pelo accessibilityText do item do drawer
# ('Louvor,  - Líder, ...'): a Home atrás também tem texto 'Louvor' (card de evento),
# e tocar nele cai no item 'Ajuda' do drawer. Sem retry: re-tap cai em outro item.
- tapOn:
    text: 'Louvor, +- Líder.*'
    retryTapIfNoChange: false
- waitForAnimationToEnd: { timeout: 1500 }
- scrollUntilVisible:
    element: { text: '.+, Funções' }
    direction: DOWN
    timeout: 10000
- tapOn:
    text: '.+, Funções'
    retryTapIfNoChange: false
- waitForAnimationToEnd: { timeout: 4000 }
# Drawer fechou (item de topo do menu não aparece mais)
- assertNotVisible: 'Minhas Indisponibilidades'
- assertVisible: 'Funções'
- takeScreenshot: ministerios-funcoes
