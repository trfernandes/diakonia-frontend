appId: com.church.artos
---
# ═══════════════════════════════════════════════════════════════════
# Regressão V1: REG-08 — Perfil
#
# O que valida:
#   1. Usuário consegue acessar e visualizar seu perfil
#   2. Tela de edição de perfil carrega
#   3. Usuário consegue editar dados do perfil
#   4. Alterações são salvas corretamente
#
# Pré-condição: Usuário deve estar logado.
#
# Tags: p0, regressao-v1
# ═══════════════════════════════════════════════════════════════════

- launchApp

- waitForAnimationToEnd:
    timeout: 5000

# Fazer login se necessário
- runFlow: _login.yaml

# Navegar para perfil via deep link
- openLink: diakonia:///pessoal/perfil

- waitForAnimationToEnd:
    timeout: 4000

# Verificar que tela de perfil carregou
- assertVisible:
    text: 'Perfil'
    optional: true

# Se houver botão de editar, tocar nele
- tapOn:
    text: 'Editar'
    optional: true

- waitForAnimationToEnd:
    timeout: 2000

# Procurar por campo de nome ou algum campo editável
- assertVisible:
    text: 'Nome'
    optional: true

# Se houver campo editável de nome, tentar editar
- tapOn:
    text: 'Nome'
    optional: true

- waitForAnimationToEnd:
    timeout: 1000

# Tentar salvar/confirmar se houver botão
- tapOn:
    text: 'Salvar'
    optional: true

- tapOn:
    text: 'Confirmar'
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

- takeScreenshot: regressao-v1-perfil
